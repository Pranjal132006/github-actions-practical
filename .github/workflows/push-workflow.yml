

name: Push Trigger Workflow

on:

  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  
  workflow_dispatch:

jobs:
  
  push-job:
  
    runs-on: ubuntu-latest

    steps:

      - name: Success Message
        run: echo "Code pushed successfully!"

      - name: Display Date and Time
